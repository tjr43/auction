<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 경매 시스템</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#1a1a1a',
                        panel: '#2d2d2d',
                        accentA: '#ff6b6b',
                        accentB: '#4dabf7',
                        highlight: '#ffd43b'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background-color: #1a1a1a; color: #e0e0e0; overflow: hidden; }
        .scroll-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="login-modal" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center">
        <div class="bg-panel p-8 rounded-xl max-w-md w-full text-center border border-gray-700 shadow-2xl">
            <h2 class="text-3xl font-bold text-highlight mb-6">🎲 온라인 경매 입장</h2>
            <div class="space-y-4">
                <button onclick="selectRole('A')" class="w-full py-4 bg-accentA/20 hover:bg-accentA/40 border-2 border-accentA text-accentA rounded-lg font-bold transition flex justify-between px-6 items-center">
                    <span>🔴 A팀 팀장으로 입장</span>
                    <span id="status-a" class="text-xs bg-black/50 px-2 py-1 rounded">대기중</span>
                </button>
                <button onclick="selectRole('B')" class="w-full py-4 bg-accentB/20 hover:bg-accentB/40 border-2 border-accentB text-accentB rounded-lg font-bold transition flex justify-between px-6 items-center">
                    <span>🔵 B팀 팀장으로 입장</span>
                    <span id="status-b" class="text-xs bg-black/50 px-2 py-1 rounded">대기중</span>
                </button>
                <div class="h-px bg-gray-600 my-4"></div>
                <button onclick="selectRole('spectator')" class="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-bold transition">
                    👀 관전자로 입장
                </button>
            </div>
            <p class="mt-6 text-xs text-gray-500">* Firebase 연결 대기 중...</p>
        </div>
    </div>

    <header class="bg-black border-b border-gray-700 h-14 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-gavel text-highlight"></i>
            <span class="font-bold text-lg">Auction Online</span>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <span id="my-role-display" class="px-3 py-1 rounded bg-gray-800 border border-gray-600">접속중...</span>
            <button onclick="resetGame()" class="text-red-400 hover:text-red-300 text-xs underline">⚠️ 게임 초기화</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <div class="w-1/5 bg-panel border-r border-gray-700 flex flex-col p-4">
            <h3 class="font-bold mb-4 flex justify-between items-center">
                <span>📂 대기실</span>
                <span id="waiting-count" class="text-xs bg-gray-700 px-2 py-1 rounded">0</span>
            </h3>
            <div class="mb-4">
                <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="uploadImages(this.files)">
                <button onclick="document.getElementById('fileInput').click()" class="w-full py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 사진 추가
                </button>
            </div>
            <div id="waiting-grid" class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 content-start pr-1"></div>
        </div>

        <div class="w-1/2 bg-dark flex flex-col relative">
            <div class="flex-1 flex flex-col justify-center items-center p-8">
                <div class="relative w-80 h-80 bg-black rounded-2xl border-4 border-gray-600 shadow-2xl overflow-hidden flex justify-center items-center mb-6">
                    <img id="main-display" src="" class="w-full h-full object-cover hidden">
                    <div id="placeholder-text" class="text-gray-500 text-center">
                        <i class="fa-solid fa-image text-4xl mb-2"></i><br>경매 대기중
                    </div>
                    <div id="roulette-overlay" class="absolute inset-0 bg-black flex justify-center items-center hidden z-10">
                        <img id="roulette-img" class="w-full h-full object-cover opacity-80">
                    </div>
                </div>
                <div class="text-center space-y-2">
                    <div class="text-gray-400 text-sm">현재 가격</div>
                    <div class="text-5xl font-bold text-highlight drop-shadow-lg"><span id="current-price">0</span>원</div>
                    <div id="auction-status" class="h-6 text-sm text-gray-500">시작 전</div>
                </div>
                
                <button id="btn-start" onclick="startAuction()" class="mt-8 px-8 py-3 bg-highlight text-black font-bold rounded-full hover:bg-yellow-400 transition hidden shadow-lg shadow-yellow-500/20">
                    START AUCTION
                </button>

                <div id="skip-container" class="mt-4 hidden text-center">
                    <button id="btn-skip" onclick="voteSkip()" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-full transition shadow-lg text-sm border border-gray-500">
                        🤝 순서 미루기 (합의) - <span id="skip-status">0/2</span>
                    </button>
                </div>
            </div>

            <div class="h-48 border-t border-gray-700 flex">
                <div id="ctrl-a" class="flex-1 bg-gradient-to-t from-red-900/20 to-transparent p-4 flex flex-col items-center justify-center opacity-30 pointer-events-none transition-all duration-300">
                    <h4 class="text-accentA font-bold mb-2">TEAM A</h4>
                    <input type="number" id="input-a" class="bg-gray-800 border border-gray-600 rounded p-2 w-32 text-center mb-2 text-white" placeholder="금액">
                    <div class="flex gap-2">
                        <button onclick="placeBid('A')" class="px-4 py-2 bg-accentA text-white rounded font-bold hover:brightness-110">입찰</button>
                        <button onclick="passTurn('A')" class="px-4 py-2 bg-gray-600 text-white rounded font-bold hover:bg-gray-500">포기</button>
                    </div>
                </div>
                <div id="ctrl-b" class="flex-1 bg-gradient-to-t from-blue-900/20 to-transparent p-4 flex flex-col items-center justify-center opacity-30 pointer-events-none transition-all duration-300">
                    <h4 class="text-accentB font-bold mb-2">TEAM B</h4>
                    <input type="number" id="input-b" class="bg-gray-800 border border-gray-600 rounded p-2 w-32 text-center mb-2 text-white" placeholder="금액">
                    <div class="flex gap-2">
                        <button onclick="placeBid('B')" class="px-4 py-2 bg-accentB text-white rounded font-bold hover:brightness-110">입찰</button>
                        <button onclick="passTurn('B')" class="px-4 py-2 bg-gray-600 text-white rounded font-bold hover:bg-gray-500">포기</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-[30%] bg-panel border-l border-gray-700 flex flex-col p-4">
            <div class="space-y-4 mb-4">
                <div class="bg-dark p-3 rounded-lg border-l-4 border-accentA">
                    <div class="flex justify-between mb-2">
                        <span class="font-bold text-accentA">Team A</span>
                        <span id="money-a" class="font-mono">1000원</span>
                    </div>
                    <div id="roster-a" class="flex flex-wrap gap-1 h-16 overflow-y-auto content-start"></div>
                </div>
                <div class="bg-dark p-3 rounded-lg border-l-4 border-accentB">
                    <div class="flex justify-between mb-2">
                        <span class="font-bold text-accentB">Team B</span>
                        <span id="money-b" class="font-mono">1000원</span>
                    </div>
                    <div id="roster-b" class="flex flex-wrap gap-1 h-16 overflow-y-auto content-start"></div>
                </div>
            </div>
            <div class="flex-1 bg-black rounded-lg border border-gray-700 flex flex-col overflow-hidden">
                <div id="chat-box" class="flex-1 overflow-y-auto p-3 text-sm space-y-1"></div>
                <form onsubmit="sendChat(event)" class="flex border-t border-gray-700">
                    <input type="text" id="chat-input" class="flex-1 bg-transparent p-3 outline-none text-white placeholder-gray-600" placeholder="채팅 입력...">
                    <button type="submit" class="px-4 bg-gray-800 hover:bg-gray-700 text-gray-300 transition">전송</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, setDoc, arrayUnion, collection, addDoc, query, orderBy, limit, serverTimestamp, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYyjK1qwPObsSXFSEmnye64iTFvcIY1Lg",
            authDomain: "auction-dfc5c.firebaseapp.com",
            projectId: "auction-dfc5c",
            storageBucket: "auction-dfc5c.firebasestorage.app",
            messagingSenderId: "422510640786",
            appId: "1:422510640786:web:7fdd804b61ac401408b04b"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'auction-room-01';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 경로 상수
        const BASE_PATH = `artifacts/${appId}/public/data`;
        
        let myRole = null; 
        let myUid = null;
        let gameState = { teams: { A: {}, B: {} }, status: 'idle', skipVotes: { A: false, B: false } };

        const getTeamsRef = () => doc(db, BASE_PATH, 'teams', 'general');
        const getGameStateRef = () => doc(db, BASE_PATH, 'game_state', 'general');

        async function init() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        myUid = user.uid;
                        console.log("Logged in:", myUid);
                        setupListeners();
                    }
                });
            } catch (e) {
                console.error("Auth Error:", e);
                alert("Firebase 연결 실패.");
            }
        }
        init();

        window.selectRole = async (role) => {
            if (!myUid) return alert("로그인 정보가 없습니다.");
            if (role === 'A' && gameState.teams?.A?.leader && gameState.teams.A.leader !== myUid) return alert("이미 접속 중입니다.");
            if (role === 'B' && gameState.teams?.B?.leader && gameState.teams.B.leader !== myUid) return alert("이미 접속 중입니다.");

            myRole = role;
            document.getElementById('login-modal').classList.add('hidden');
            const roleName = role === 'A' ? '🔴 A팀장' : (role === 'B' ? '🔵 B팀장' : '👀 관전자');
            document.getElementById('my-role-display').innerText = roleName;

            if (role !== 'spectator') {
                const updates = {};
                if (role === 'A') updates["A.leader"] = myUid;
                if (role === 'B') updates["B.leader"] = myUid;
                await updateDoc(getTeamsRef(), updates).catch(async () => {
                     await setDoc(getTeamsRef(), {
                        A: { money: 1000, roster: [], leader: role === 'A' ? myUid : null },
                        B: { money: 1000, roster: [], leader: role === 'B' ? myUid : null }
                     }, { merge: true });
                });
            }
            sendSystemMessage(`${roleName}님이 입장했습니다.`);
        };

        function setupListeners() {
            onSnapshot(getGameStateRef(), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                gameState = { ...gameState, ...data };
                renderGameUI(gameState);
                handleRouletteEffect(data);
            });

            onSnapshot(getTeamsRef(), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                gameState.teams = data;
                
                document.getElementById('money-a').innerText = (data.A?.money || 0) + '원';
                document.getElementById('money-b').innerText = (data.B?.money || 0) + '원';
                renderRoster('roster-a', data.A?.roster);
                renderRoster('roster-b', data.B?.roster);

                const statusA = document.getElementById('status-a');
                const statusB = document.getElementById('status-b');
                if(statusA) statusA.innerText = data.A?.leader ? '접속중' : '대기중';
                if(statusB) statusB.innerText = data.B?.leader ? '접속중' : '대기중';

                renderGameUI(gameState);
            });

            const qImages = query(collection(db, BASE_PATH, 'images'), orderBy('createdAt'));
            onSnapshot(qImages, (snap) => {
                const grid = document.getElementById('waiting-grid');
                grid.innerHTML = '';
                gameState.images = [];
                snap.forEach(docSnap => {
                    const imgData = docSnap.data();
                    gameState.images.push({ id: docSnap.id, url: imgData.data });
                    
                    const img = document.createElement('img');
                    img.src = imgData.data;
                    img.className = "w-full aspect-square object-cover rounded border border-gray-600 bg-black";
                    grid.appendChild(img);
                });
                document.getElementById('waiting-count').innerText = gameState.images.length;
            });

            const qChat = query(collection(db, BASE_PATH, 'chat'), orderBy('timestamp', 'desc'), limit(50));
            onSnapshot(qChat, (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                const messages = [];
                snap.forEach(d => messages.push(d.data()));
                messages.reverse().forEach(msg => {
                    const div = document.createElement('div');
                    if (msg.type === 'system') {
                        div.className = "text-yellow-500 italic text-xs text-center my-2";
                        div.innerText = `📢 ${msg.text}`;
                    } else {
                        const color = msg.role === 'A' ? 'text-accentA' : (msg.role === 'B' ? 'text-accentB' : 'text-gray-400');
                        div.innerHTML = `<span class="font-bold ${color}">${msg.sender}:</span> ${msg.text}`;
                    }
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function renderGameUI(state) {
            const priceEl = document.getElementById('current-price');
            const statusEl = document.getElementById('auction-status');
            const mainImg = document.getElementById('main-display');
            const placeholder = document.getElementById('placeholder-text');
            const ctrlA = document.getElementById('ctrl-a');
            const ctrlB = document.getElementById('ctrl-b');
            const btnStart = document.getElementById('btn-start');
            const skipContainer = document.getElementById('skip-container');
            const btnSkip = document.getElementById('btn-skip');

            priceEl.innerText = state.currentPrice || 0;

            if (state.currentItem) {
                mainImg.src = state.currentItem;
                mainImg.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                mainImg.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }

            if (state.status === 'auction') {
                const bidder = state.currentBidder ? `${state.currentBidder}팀` : '입찰 대기';
                statusEl.innerHTML = `<span class="${state.currentBidder==='A'?'text-accentA':'text-accentB'}">${bidder}</span> 입찰 중`;
                
                const isMyTurn = (myRole === 'A' && state.currentBidder !== 'A') || 
                                 (myRole === 'B' && state.currentBidder !== 'B');
                const canBid = isMyTurn || state.currentBidder === null;

                ctrlA.style.opacity = (myRole === 'A' && canBid) ? '1' : '0.3';
                ctrlA.style.pointerEvents = (myRole === 'A' && canBid) ? 'auto' : 'none';
                ctrlB.style.opacity = (myRole === 'B' && canBid) ? '1' : '0.3';
                ctrlB.style.pointerEvents = (myRole === 'B' && canBid) ? 'auto' : 'none';

                if(myRole === 'A' && canBid) document.getElementById('input-a').value = (state.currentPrice || 0) + 10;
                if(myRole === 'B' && canBid) document.getElementById('input-b').value = (state.currentPrice || 0) + 10;
                
                btnStart.classList.add('hidden');
                
                // 순서 미루기 버튼 표시 로직
                skipContainer.classList.remove('hidden');
                const votes = state.skipVotes || { A: false, B: false };
                let agreeCount = (votes.A ? 1 : 0) + (votes.B ? 1 : 0);
                
                if (myRole === 'A' || myRole === 'B') {
                    if (votes[myRole]) {
                        btnSkip.innerText = "상대방 동의 대기중...";
                        btnSkip.className = "px-6 py-2 bg-green-700 text-white rounded-full shadow-lg text-sm border border-green-500 cursor-not-allowed opacity-80";
                    } else {
                        btnSkip.innerText = `🤝 순서 미루기 (합의) - ${agreeCount}/2`;
                        btnSkip.className = "px-6 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-full transition shadow-lg text-sm border border-gray-500";
                    }
                } else {
                    btnSkip.innerText = `🤝 순서 미루기 현황 - ${agreeCount}/2`;
                    btnSkip.className = "px-6 py-2 bg-gray-800 text-gray-400 rounded-full shadow-lg text-sm border border-gray-700 cursor-not-allowed";
                }

            } else {
                statusEl.innerText = state.status === 'rolling' ? "추첨 중..." : "다음 경매 대기중";
                ctrlA.style.opacity = '0.3'; ctrlA.style.pointerEvents = 'none';
                ctrlB.style.opacity = '0.3'; ctrlB.style.pointerEvents = 'none';

                const isReady = gameState.teams?.A?.leader && gameState.teams?.B?.leader;
                if (isReady && state.status === 'idle') {
                    btnStart.classList.remove('hidden');
                } else {
                    btnStart.classList.add('hidden');
                }
                
                // 순서 미루기 버튼 숨기기
                skipContainer.classList.add('hidden');
            }
        }

        function renderRoster(id, roster) {
            const el = document.getElementById(id);
            el.innerHTML = '';
            if (roster) roster.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = "w-8 h-8 object-cover rounded border border-gray-600";
                el.appendChild(img);
            });
        }

        window.uploadImages = async (files) => {
            if (!files.length) return;
            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    await addDoc(collection(db, BASE_PATH, 'images'), {
                        data: e.target.result,
                        createdAt: serverTimestamp()
                    });
                };
                reader.readAsDataURL(files[i]);
            }
            sendSystemMessage("새로운 선수가 대기실에 등록되었습니다.");
        };

        window.startAuction = async () => {
            if (!gameState.images || gameState.images.length === 0) return alert("대기실에 이미지가 없습니다!");
            const randIdx = Math.floor(Math.random() * gameState.images.length);
            const targetObj = gameState.images[randIdx];

            await setDoc(getGameStateRef(), {
                status: 'rolling',
                rollingTarget: { id: targetObj.id, url: targetObj.url }, 
                timestamp: Date.now()
            }, { merge: true });
        };

        let isRolling = false;
        function handleRouletteEffect(data) {
            if (data.status === 'rolling' && !isRolling) {
                isRolling = true;
                const overlay = document.getElementById('roulette-overlay');
                const imgEl = document.getElementById('roulette-img');
                overlay.classList.remove('hidden');
                
                let count = 0;
                const pool = gameState.images && gameState.images.length > 0 ? gameState.images : [{url: ''}];

                const interval = setInterval(() => {
                    const randomImg = pool[Math.floor(Math.random() * pool.length)];
                    if(randomImg && randomImg.url) imgEl.src = randomImg.url;
                    
                    count++;
                    if (count >= 20) {
                        clearInterval(interval);
                        setTimeout(() => finishRolling(data.rollingTarget), 500);
                    }
                }, 100);
            }
        }

        async function finishRolling(target) {
            document.getElementById('roulette-overlay').classList.add('hidden');
            isRolling = false;

            if (!target || !target.url) {
                console.error("Target is invalid:", target);
                return;
            }

            if (myRole === 'A' || (myRole === 'B' && !gameState.teams.A?.leader)) {
                 await updateDoc(getGameStateRef(), {
                    status: 'auction', 
                    currentItem: target.url,     
                    currentItemId: target.id,    
                    currentPrice: 10, 
                    currentBidder: null,
                    skipVotes: { A: false, B: false } // 상태 초기화 추가
                });
            }
        }

        window.placeBid = async (team) => {
            const val = parseInt(document.getElementById(team === 'A' ? 'input-a' : 'input-b').value);
            if (val > (gameState.teams[team].money || 0)) return alert("돈이 부족합니다!");
            if (val <= (gameState.currentPrice || 0)) return alert("현재가보다 높아야 합니다.");
            
            await updateDoc(getGameStateRef(), { currentPrice: val, currentBidder: team });
            sendSystemMessage(`${team}팀이 ${val}원에 입찰했습니다!`);
        };

        window.passTurn = async (team) => {
            if (!confirm("포기하시겠습니까?")) return;
            const opponent = team === 'A' ? 'B' : 'A';
            const price = gameState.currentPrice || 0;
            const updates = {};
            updates[`${opponent}.money`] = (gameState.teams[opponent].money || 0) - price;
            updates[`${opponent}.roster`] = arrayUnion(gameState.currentItem);
            
            await updateDoc(getTeamsRef(), updates);

            if (gameState.currentItemId) {
                try {
                    await deleteDoc(doc(db, BASE_PATH, 'images', gameState.currentItemId));
                } catch(e) {
                    console.error("이미지 삭제 실패:", e);
                }
            }

            await updateDoc(getGameStateRef(), { 
                status: 'idle', currentBidder: null, currentItem: null, currentItemId: null, currentPrice: 10,
                skipVotes: { A: false, B: false } // 상태 초기화 추가
            });
            sendSystemMessage(`🎉 [낙찰] ${opponent}팀이 ${price}원에 영입 성공!`);
        };

        // 순서 미루기 함수 추가
        window.voteSkip = async () => {
            if (myRole !== 'A' && myRole !== 'B') return alert("팀장만 누를 수 있습니다.");
            if (gameState.status !== 'auction') return;
            
            const otherTeam = myRole === 'A' ? 'B' : 'A';
            const currentVotes = gameState.skipVotes || { A: false, B: false };

            if (currentVotes[myRole]) {
                return alert("이미 동의하셨습니다.");
            }

            // 상대방이 이미 동의한 상태에서 내가 누른 경우 -> 미루기 확정
            if (currentVotes[otherTeam]) {
                await updateDoc(getGameStateRef(), {
                    status: 'idle',
                    currentBidder: null,
                    currentItem: null,
                    currentItemId: null,
                    currentPrice: 10,
                    skipVotes: { A: false, B: false } // 투표 상태 초기화
                });
                sendSystemMessage("🤝 양 팀의 합의로 해당 선수 경매가 뒤로 미뤄졌습니다.");
            } else {
                // 나만 먼저 동의한 경우 -> 내 동의 상태만 저장
                await updateDoc(getGameStateRef(), {
                    [`skipVotes.${myRole}`]: true
                });
                sendSystemMessage(`⏳ ${myRole}팀장이 순서 미루기에 동의했습니다. (상대팀 동의 대기중)`);
            }
        };

        window.sendChat = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            await addDoc(collection(db, BASE_PATH, 'chat'), {
                sender: myRole === 'A' ? 'A팀장' : (myRole === 'B' ? 'B팀장' : '관전자'),
                role: myRole || 'spectator',
                text: text,
                type: 'msg',
                timestamp: serverTimestamp()
            });
            input.value = '';
        };

        async function sendSystemMessage(text) {
            await addDoc(collection(db, BASE_PATH, 'chat'), { text, type: 'system', timestamp: serverTimestamp() });
        }

        window.resetGame = async () => {
            if (!confirm("정말 모든 데이터를 삭제하시겠습니까? (이미지 포함)")) return;
            
            await setDoc(getTeamsRef(), {
                A: { money: 1000, roster: [], leader: null },
                B: { money: 1000, roster: [], leader: null }
            });
            await setDoc(getGameStateRef(), {
                status: 'idle', currentPrice: 10, currentBidder: null, currentItem: null,
                skipVotes: { A: false, B: false } // 상태 초기화 추가
            });

            const imagesQ = query(collection(db, BASE_PATH, 'images'));
            const imagesSnap = await getDocs(imagesQ);
            const imgPromises = imagesSnap.docs.map(doc => deleteDoc(doc.ref));
            await Promise.all(imgPromises);

            const chatQ = query(collection(db, BASE_PATH, 'chat'));
            const chatSnap = await getDocs(chatQ);
            const chatPromises = chatSnap.docs.map(doc => deleteDoc(doc.ref));
            await Promise.all(chatPromises);

            alert("초기화 완료!");
            location.reload();
        }
    </script>
</body>
</html>
